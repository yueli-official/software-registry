name: Discover release
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      software:
        description: Software identifier, or all
        type: string
        required: true
        default: all
permissions:
  contents: read
jobs:
  discover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOFTWARE_ID: ${{ inputs.software || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Freeze the official release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          software = os.environ['SOFTWARE_ID']
          if software == 'all':
              raise SystemExit(subprocess.call(['software-registry', '--catalog', 'software', 'plan-all', '--output-directory', 'release-plan']))
          if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', software):
              raise SystemExit('Invalid software identifier')
          raise SystemExit(subprocess.call(['software-registry', '--catalog', 'software', 'plan', software, '--output', 'release-plan/release-plan.json']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan/
          if-no-files-found: error
          retention-days: 14
