[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "software-registry"
version = "0.1.0"
description = "Declarative software catalog and reproducible release plans"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
software-registry = "software_registry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
software_registry = ["schema.json"]
